# Curated timeline annotations for TrendXiv charts.
#
# Every `date` is the arXiv v1 posting month, taken from the <published> field of
# the arXiv API (which reports v1, not the latest revision), NOT the journal
# publication month, the conference month, or the press-release month. Where the
# two differ the `description` says so, because a flag drawn a year away from the
# posting month it claims to mark is worse than no flag at all.
#
# `on_arxiv: false` marks work that was never posted to arXiv. Those events still
# belong on the timeline (AlexNet moved the whole field without an arXiv record),
# but the flag must not imply an arXiv posting that does not exist.
#
# Schema (all fields required):
#   date        YYYY-MM
#   label       full name, shown on hover
#   short       <= 18 chars, the on-chart flag
#   url         primary source
#   scope       categories/terms the event is relevant to; [] means global
#   weight      1-5, decides which of several colliding flags renders
#   kind        paper | model | release | policy | infrastructure | taxonomy
#   description one sentence of context
#   on_arxiv    whether the work itself was posted to arXiv

